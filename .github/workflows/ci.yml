name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          cd src/backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: cd src/backend && ruff check .
      - name: Pytest
        run: cd src/backend && python -m pytest ../../tests -q
